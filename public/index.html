<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>크아 온라인 - 물풍선 대전</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 시작 화면 ===== -->
  <div id="screen-start" class="screen">
    <div class="panel">
      <h1>💦 크아 온라인</h1>
      <p class="subtitle">물풍선 술래잡기 멀티플레이</p>
      <input id="input-name" type="text" placeholder="닉네임을 입력하세요" maxlength="12" />
      <button id="btn-create" class="btn btn-primary">방 만들기</button>
      <div class="divider">또는</div>
      <input id="input-roomcode" type="text" placeholder="방 코드 입력 (예: AB12)" maxlength="4" style="text-transform:uppercase" />
      <button id="btn-join" class="btn btn-secondary">방 참가하기</button>
      <p id="start-error" class="error-text"></p>
    </div>
  </div>

  <!-- ===== 로비 화면 ===== -->
  <div id="screen-lobby" class="screen hidden">
    <div class="panel panel-wide">
      <h2>대기실 <span id="lobby-roomcode" class="room-code"></span></h2>
      <p class="hint">친구에게 방 코드를 공유하세요 (최대 4인)</p>
      <ul id="lobby-players" class="player-list"></ul>
      <div class="lobby-actions">
        <button id="btn-ready" class="btn btn-secondary">준비 완료</button>
        <button id="btn-start" class="btn btn-primary hidden">게임 시작</button>
      </div>
      <p id="lobby-error" class="error-text"></p>
    </div>
  </div>

  <!-- ===== 게임 화면 ===== -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <div id="hud-players" class="hud-players"></div>
      <div class="room-code-small">방 코드: <span id="game-roomcode"></span></div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div class="mobile-controls" id="mobile-controls">
      <div class="dpad">
        <button class="dpad-btn" data-dir="up">▲</button>
        <button class="dpad-btn" data-dir="left">◀</button>
        <button class="dpad-btn" data-dir="right">▶</button>
        <button class="dpad-btn" data-dir="down">▼</button>
      </div>
      <button class="btn-action" id="btn-bubble">💦</button>
    </div>
    <div id="chat-box" class="chat-box">
      <div id="chat-log" class="chat-log"></div>
      <input id="chat-input" type="text" placeholder="Enter로 채팅" maxlength="120" />
    </div>
  </div>

  <!-- ===== 결과 화면 ===== -->
  <div id="screen-result" class="screen hidden">
    <div class="panel">
      <h2 id="result-title">게임 종료</h2>
      <p id="result-sub"></p>
      <button id="btn-again" class="btn btn-primary hidden">다시 시작</button>
      <p class="hint" id="result-wait">방장이 다음 게임을 준비 중입니다...</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
